<style>
:root{--ink:#1d1d1c;--muted:#858580;--line:#e7e7e3;--paper:#fff;--soft:#f8f8f6;--green:#25634b}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.65 -apple-system,BlinkMacSystemFont,"Noto Sans TC","Noto Sans KR",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #777;outline-offset:3px}
.layout{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:34px 22px;display:flex;flex-direction:column;background:#fff}
.brand{font-size:25px;font-weight:650;letter-spacing:-.075em;line-height:1.1}.brand-sub{font-size:9px;letter-spacing:.2em;color:var(--muted);margin-top:12px}
.nav{margin:65px 0 0;display:grid;gap:5px}.nav button{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:12px 13px;color:#666;background:none;border:0;font-size:12px}.nav button:hover,.nav button[aria-current="page"]{background:#f5f5f3;color:#111}.nav small{color:#aaa;font-size:10px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:20px;display:grid;gap:13px}.side-foot a{font-size:11px;color:#555}
.content{width:min(1120px,calc(100% - 100px));margin:0 auto;padding-bottom:95px}
.topbar{height:98px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}
.overline{font-size:10px;letter-spacing:.16em;color:#999}.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{background:#fff;border:1px solid #d2d2cc;padding:10px 15px;color:#222;font-size:11px;letter-spacing:.015em}.btn:hover{background:#f7f7f5}
.btn.dark{background:#222;color:white;border-color:#222}.btn.dark:hover{background:#444}.btn:disabled{opacity:.45;cursor:not-allowed}
.hero{padding:56px 0 41px}.hero h1{font-size:clamp(26px,3vw,39px);font-weight:400;line-height:1.3;letter-spacing:-.015em;margin:11px 0}.hero p{margin:0;color:#777;font-size:12px;max-width:710px}
.notice{border:1px solid #deded8;background:#fafaf8;padding:16px 19px;color:#555;font-size:11px;line-height:1.9;margin-bottom:35px}
.panel{border-top:1px solid var(--line);padding:31px 0}.panel-title{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:27px}.panel-title h2{font-weight:500;font-size:15px;margin:0}.panel-title span{font-size:10px;color:#999}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:21px 25px}
.field{min-width:0;display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}
.field label{font-size:11px;color:#777}.field input,.field textarea,.field select{width:100%;border:1px solid #dddcd7;background:white;border-radius:0;padding:11px 12px;color:#1b1b1b;min-height:43px}
.field textarea{min-height:114px;resize:vertical;line-height:1.7}
.field small{font-size:10px;color:#aaa}
.photo-uploader{border:1px solid var(--line);padding:18px;background:var(--soft);display:grid;gap:13px}
.photo-uploader img{width:min(100%,380px);max-height:400px;object-fit:contain;background:#eee}
.photo-uploader .upload-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.photo-uploader .upload-status{font-size:11px;color:#666;white-space:pre-wrap;overflow-wrap:anywhere}
.photo-uploader button:disabled{opacity:.5;cursor:not-allowed}
.release-review{border:1px solid var(--line);padding:22px;background:#fff;display:grid;gap:12px;margin-bottom:28px}
.release-review h2{font-size:15px;font-weight:500;margin:0}
.release-review p{font-size:12px;color:#666;margin:0}
.release-review ul{padding-left:20px;color:#555;margin:0}
.release-review .toolbar{justify-content:flex-start}
.release-review [data-release-status]{font-size:11px;color:#777}
.release-media{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:14px}
.release-media figure{margin:0;min-width:0}
.release-media img{width:100%;height:180px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.release-media figcaption{font-size:10px;color:#777;overflow-wrap:anywhere;padding-top:5px}
.release-check{display:flex;gap:8px;align-items:flex-start;font-size:12px}
.release-check input{margin-top:4px}


.photo-uploader .upload-status{line-height:1.8}
.photo-stills{grid-column:1/-1;display:grid;gap:15px}
.still-entry{border:1px solid var(--line);padding:18px;display:grid;gap:12px}
.still-entry .photo-uploader{border:0;padding:0}
.still-top{display:flex;justify-content:space-between;align-items:center;gap:15px}

.checkline{display:flex;align-items:center;gap:9px;font-size:12px}.checkline input{width:15px;height:15px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.metric{padding:19px;border:1px solid var(--line);min-height:98px}.metric strong{display:block;font-size:28px;font-weight:400}.metric span{display:block;color:#999;font-size:10px;margin-top:7px}
.collection{display:grid;gap:11px}.entry{border:1px solid var(--line);padding:16px;display:flex;gap:15px;align-items:center;justify-content:space-between}.entry-info{min-width:0}.entry-title{font-weight:500;font-size:13px;overflow-wrap:anywhere}.entry-sub{font-size:10px;color:#929292;margin-top:3px}.entry-actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:34px;border:1px dashed #deded9;color:#aaa;font-size:12px;text-align:center}
.collection-editor{border:1px solid var(--line);background:#fcfcfb;padding:23px;margin-top:16px}
.toolbar{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toolbar-note{font-size:10px;color:#999}
.status{font-size:11px;color:#777}.status.good{color:var(--green)}
footer{border-top:1px solid var(--line);padding-top:27px;font-size:10px;color:#999}
[hidden]{display:none!important}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:20px 18px;border-bottom:1px solid var(--line);border-right:0}.brand{font-size:23px}.brand-sub{margin-top:3px}.nav{margin:18px -4px 0;display:flex;overflow-x:auto;gap:3px}.nav button{width:auto;white-space:nowrap;padding:10px}.nav small,.side-foot{display:none}.content{width:calc(100% - 38px)}.topbar{height:auto;min-height:77px;padding:13px 0}.hero{padding:38px 0 33px}.form-grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.cards{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column;gap:9px}.entry{align-items:flex-start;flex-direction:column}.content{width:calc(100% - 30px)}.panel{padding:23px 0}.collection-editor{padding:14px}}
</style>
</head>

<div class="layout">
  <aside class="sidebar">
    <div><a href="../" class="brand" aria-label="CHEN. official website">CHEN.</a><div class="brand-sub">CONTENT STUDIO / PREVIEW</div></div>

  <main class="content">
    <header class="topbar"><span class="overline">CHEN. / WEBSITE MANAGEMENT</span><div class="top-actions"><button class="btn" id="import">匯入 JSON</button><button class="btn" id="export">匯出修改檔案</button><button class="btn dark" id="publish" hidden>儲存草稿</button><button class="btn" id="preview-site" hidden>預覽網站</button><button class="btn" id="review-release" hidden>正式發布檢查</button><button class="btn" id="login" hidden>使用 GitHub 登入</button><button class="btn" id="logout" hidden>登出</button></div></header>
    <section class="hero"><div class="overline" id="page-tag">OVERVIEW</div><h1 id="page-title">網站管理總覽</h1><p id="page-description">管理 CHEN. 官方網站內容。這是客製化後台第一階段，可編輯資料並匯出 JSON；尚未連接安全發布服務。</p></section>
    <div class="notice" id="auth-notice" role="status"><strong>預覽模式。</strong> 目前未連接已部署的安全服務。可編輯並匯出 JSON；內容不會自動發布。請勿在此輸入密碼或 GitHub Token。</div>
    <section class="release-review" id="release-review-panel" hidden></section><div id="view"></div>
    <footer>CHEN. CONTENT STUDIO · FIRST STAGE · NO AUTHENTICATED PUBLISHING</footer>
  </main>
</div>
<input type="file" id="file-input" accept=".json,application/json" hidden>
<script>
(() => {
  "use strict";
  const DATA_URL = new URL("https://raw.githubusercontent.com/chenofficial0/portfolio/main/content/site.json");
  const isWorkerHost = location.pathname==="/studio" && location.protocol==="https:";
  let apiSession=null,contentSha=null;
  const pages = {
    dashboard:["OVERVIEW","網站管理總覽","檢視目前內容完整度，選擇要編輯的網站區域。"],
    about:["ABOUT","個人介紹","修改中、英、韓姓名與簡介。"],
    profile:["PROFILE","演員資料","維護演員資料、模特卡與影片連結。"],
    works:["FILMOGRAPHY","演出作品","新增作品、調整演出資訊，依年份由新到舊顯示。"],
    gallery:["GALLERY","攝影相簿","新增攝影作品與三語說明。"],
    contact:["CONTACT","合作聯絡","編輯工作信箱及社群平台連結。"]
  };
  const categories=["Film","Drama","Commercial","Music Video","Modeling","Other"];
  const aboutFields=[
    ["name_zh","中文姓名"],["name_en","英文姓名"],["name_ko","韓文姓名"],
    ["birth_year","出生年份","number"],["show_birth_year","公開出生年份","checkbox"],["based_in","所屬地區"],
    ["languages","語言能力（以逗號分隔）","languages"],
    ["hero_image","首頁主要照片（電腦及手機）","photo"],
    ["hero_image_secondary","首頁次要照片（僅電腦版顯示）","photo"],
    ["bio_zh","中文簡介","textarea"],["bio_en","英文簡介","textarea"],["bio_ko","韓文簡介","textarea"]
  ];
  const profileFields=[
    ["photo","PROFILE 形象照片","photo"],["height","身高（cm）"],["weight","體重（可選填）"],
    ["bust","胸圍"],["waist","腰圍"],["hips","臀圍"],["shoe_size","鞋碼"],
    ["hair_color_zh","髮色（中文）"],["hair_color_en","髮色（英文）"],["hair_color_ko","髮色（韓文）"],
    ["eye_color_zh","瞳色（中文）"],["eye_color_en","瞳色（英文）"],["eye_color_ko","瞳色（韓文）"],
    ["agency_zh","經紀公司（中文）"],["agency_en","經紀公司（英文）"],["agency_ko","經紀公司（韓文）"],
    ["skills_zh","專長（中文）"],["skills_en","專長（英文）"],["skills_ko","專長（韓文）"],
    ["model_card_pdf","模特卡 PDF 路徑"],["resume_pdf","演員履歷 PDF 路徑"],["showreel_url","演出影片連結"]
  ];
  const contactFields=[["email","工作信箱","email"],["instagram","Instagram 連結"],["other_url","其他社群連結"]];
  const workFields=[
    ["title_zh","作品名稱（中文）"],["title_en","作品名稱（英文）"],["title_ko","作品名稱（韓文）"],
    ["year","年份","number"],["production","製作公司 / 品牌"],
    ["role_zh","角色（中文）"],["role_en","角色（英文）"],["role_ko","角色（韓文）"],
    ["category","作品類型","category"],["cover","作品封面照片","photo"],
    ["video_url","影片網址"],["video_label","影片按鈕文字"],["visible","公開作品","checkbox"],
    ["stills","作品劇照","photoList"]
  ];
  const galleryFields=[
    ["image","攝影相簿照片","photo"],["caption_zh","中文說明"],["caption_en","英文說明"],["caption_ko","韓文說明"]
  ];
  const view=document.getElementById("view");
  const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n};
  const btn=(label,fn,cls="btn")=>{const b=el("button",cls,label);b.type="button";b.addEventListener("click",fn);return b};
  let data={about:{},profile:{},works:[],gallery:[],contact:{}}, current="dashboard", selected=null;
  const cloned=v=>JSON.parse(JSON.stringify(v));
  const norm=d=>({
    about:(d.about && typeof d.about==="object"&&!Array.isArray(d.about))?d.about:{},
    profile:(d.profile && typeof d.profile==="object"&&!Array.isArray(d.profile))?d.profile:{},
    works:Array.isArray(d.works)?d.works:[],
    gallery:Array.isArray(d.gallery)?d.gallery:[],
    contact:(d.contact && typeof d.contact==="object"&&!Array.isArray(d.contact))?d.contact:{}
  });
  // Image input is local-preview only until an authenticated, tested upload endpoint is enabled.
  async function compressPhoto(file){
    if(!["image/jpeg","image/png","image/webp"].includes(file.type))throw Error("只支援 JPG、PNG、WebP");
    if(file.size>10*1024*1024)throw Error("請選擇小於 10 MB 的照片");
    const objectURL=URL.createObjectURL(file);
    let image;
    try{image=await createImageBitmap(file)}finally{URL.revokeObjectURL(objectURL)}
    try{
      const maxSide=2000,ratio=Math.min(1,maxSide/Math.max(image.width,image.height));
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(image.width*ratio));
      canvas.height=Math.max(1,Math.round(image.height*ratio));
      const ctx=canvas.getContext("2d");
      if(!ctx)throw Error("瀏覽器無法處理圖片");
      ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(image,0,0,canvas.width,canvas.height);
      const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",0.82));
      if(!blob||blob.size>1.5*1024*1024)throw Error("照片處理後仍超過上傳限制，請先壓縮");
      return blob;
    }finally{image.close?.()}
  }
  // Local previews persist when switching tabs, but are never encoded into site.json.
  // They remain local to this browser tab and are not uploaded to GitHub.
  const localPhotos=new WeakMap();
  const activePhotoURLs=new Set();
  function photoCache(obj){
    let cache=localPhotos.get(obj);
    if(!cache){cache=new Map();localPhotos.set(obj,cache)}
    return cache;
  }
  function cachePhoto(obj,key,blob){
    const cache=photoCache(obj);
    const previous=cache.get(key);
    if(previous){URL.revokeObjectURL(previous.url);activePhotoURLs.delete(previous.url)}
    const url=URL.createObjectURL(blob);
    activePhotoURLs.add(url);
    cache.set(key,{blob,url});
    return url;
  }
  function clearPhoto(obj,key){
    const cache=localPhotos.get(obj);
    const previous=cache?.get(key);
    if(previous){URL.revokeObjectURL(previous.url);activePhotoURLs.delete(previous.url);cache.delete(key)}
  }
  window.addEventListener("pagehide",()=>{for(const url of activePhotoURLs)URL.revokeObjectURL(url);activePhotoURLs.clear()});
  function stagedImagePreviewURL(url){
    if(!isWorkerHost||!apiSession||typeof url!=="string")return "";
    try{
      const parsed=new URL(url);
      if(parsed.hostname!=="chenofficial0.github.io")return "";
      const path=parsed.pathname.replace(/^\/portfolio\//,"");
      if(!/^assets\/uploads\/chen-(?:hero|profile|gallery|work-cover|work-still)-\d{4}-\d{2}-\d{2}-[A-Za-z0-9_-]{16}\.jpg$/.test(path))return "";
      return "/api/media/preview?path="+encodeURIComponent(path);
    }catch(_){return ""}
  }
  function createPhotoEditor(obj,key,label){
    const wrap=el("div","field full");
    wrap.append(el("label","",label));
    const panel=el("div","photo-uploader"),preview=document.createElement("img");
    preview.alt=label+"預覽";preview.hidden=true;
    const actions=el("div","upload-actions"),input=document.createElement("input");
    input.type="file";input.accept="image/jpeg,image/png,image/webp";input.hidden=true;
    input.setAttribute("aria-label",label+"，選擇照片");
    const pick=btn("選擇照片",()=>input.click());
    const upload=btn("上傳照片",async()=>{
      const entry=localPhotos.get(obj)?.get(key);
      if(!entry||!apiSession?.canUpload)return;
      if(!confirm("確定上傳照片？照片將寫入公開 GitHub 儲存庫的測試分支，但不會立刻顯示於正式網站。請確認擁有公開使用權。"))return;
      upload.disabled=true;status.textContent="正在將照片儲存至 GitHub 測試分支…";
      try{
        const base64=await new Promise((resolve,reject)=>{
          const reader=new FileReader();
          reader.onload=()=>resolve(String(reader.result).split(",")[1]||"");
          reader.onerror=()=>reject(Error("照片讀取失敗"));
          reader.readAsDataURL(entry.blob);
        });
        const scope=current==="about"?"hero":current==="profile"?"profile":current==="gallery"?"gallery":key==="cover"?"work-cover":"work-still";
        const response=await fetch("/api/media/image",{
          method:"POST",credentials:"same-origin",
          headers:{"content-type":"application/json","x-chen-csrf":apiSession.csrf},
          body:JSON.stringify({scope,mime:"image/jpeg",base64})
        });
        const result=await response.json();
        if(!response.ok)throw Error(result.error||"圖片上傳失敗");
        obj[key]=result.url;pathInput.value=result.url;entry.uploaded=true;
        markDirty();showPhoto();
        status.textContent="已儲存至 GitHub 測試分支，尚未更新正式網站。請在發布功能啟用後，確認內容再發布。";
      }catch(err){status.textContent="上傳失敗："+err.message}
      finally{upload.disabled=!apiSession?.canUpload||!localPhotos.get(obj)?.get(key)}
    },"btn dark");
    upload.disabled=true;
    upload.title=apiSession?.canUpload?"上傳至 GitHub 測試分支":"安全上傳功能尚未啟用";
    const status=el("div","upload-status","目前僅支援本機預覽，尚未上傳 GitHub；請勿將預覽當作已儲存。");
    const pathInput=document.createElement("input");
    pathInput.type="text";pathInput.value=obj[key]||"";
    pathInput.placeholder="已上傳照片的網址或路徑（可選填）";
    pathInput.setAttribute("aria-label",label+"網址");
    const hint=el("small","","JPG / PNG / WebP，原檔上限 10 MB。選取後自動產生壓縮預覽，不會直接修改網站。");
    function showPhoto(){
      const local=localPhotos.get(obj)?.get(key);
      if(local){preview.src=local.url;preview.hidden=false;status.textContent=local.uploaded?"已上傳測試分支，尚待正式發布。":"本機照片已選擇並壓縮（"+(local.blob.size/1024).toFixed(0)+" KB）。尚未上傳；切換編輯區域仍可預覽，重新整理後會消失。"}
      else if(obj[key]){preview.src=stagedImagePreviewURL(obj[key])||obj[key];preview.hidden=false;status.textContent="目前顯示已設定的圖片網址。測試分支照片透過登入後的預覽服務讀取，尚未發布至正式網站。"}
      else{preview.removeAttribute("src");preview.hidden=true;status.textContent="尚未選取照片。本機預覽不會自動儲存或發布。"}
    }
    showPhoto();
    input.addEventListener("change",async()=>{
      const file=input.files?.[0];if(!file)return;
      try{
        status.textContent="正在處理照片…";
        const blob=await compressPhoto(file);
        cachePhoto(obj,key,blob);
        upload.disabled=!apiSession?.canUpload;
        showPhoto();
      }catch(err){status.textContent="無法讀取照片："+err.message}
      finally{input.value=""}
    });
    pathInput.addEventListener("input",()=>{
      obj[key]=pathInput.value.trim();clearPhoto(obj,key);markDirty();showPhoto();
    });
    actions.append(pick,upload);
    panel.append(preview,actions,input,status,hint,pathInput);
    wrap.append(panel);
    return wrap;
  }
  function createStillsEditor(work){
    const wrap=el("div","photo-stills"),top=el("div","still-top");
    top.append(el("label","","作品劇照（可新增多張）"));
    if(!Array.isArray(work.stills))work.stills=[];
    const collection=el("div","collection");
    function refresh(){
      collection.replaceChildren();
      if(!work.stills.length)collection.append(el("div","empty","尚未新增劇照"));
      for(const [idx,still] of work.stills.entries()){
        const item=el("div","still-entry"),heading=el("div","still-top");
        heading.append(el("strong","", "劇照 "+(idx+1)),btn("移除",()=>{
          if(!confirm("從目前草稿移除此張劇照？"))return;
          clearPhoto(still,"image");work.stills.splice(idx,1);markDirty();refresh();
        }));
        item.append(heading,createPhotoEditor(still,"image","劇照照片"));
        const caption=el("div","field"),label=el("label","","劇照說明（選填）"),field=document.createElement("input");
        field.type="text";field.value=still.caption||"";field.setAttribute("aria-label","劇照說明");
        field.addEventListener("input",()=>{still.caption=field.value;markDirty()});
        caption.append(label,field);item.append(caption);collection.append(item)
      }
    }
    top.append(btn("+ 新增劇照",()=>{
      work.stills.push({image:"",caption:""});markDirty();refresh();
    }));
    wrap.append(top,collection);refresh();return wrap;
  }
  function fieldRow(obj,f){
    const [key,label,type]=f;
    if(type==="photo")return createPhotoEditor(obj,key,label);
    if(type==="photoList")return createStillsEditor(obj);
    const wrapper=el("div","field"+(type==="textarea"?" full":""));
    let input;
    if(type==="checkbox"){
      wrapper.className="field full";
      const line=el("label","checkline");input=document.createElement("input");input.type="checkbox";input.checked=Boolean(obj[key]);line.append(input,el("span","",label));wrapper.append(line);
    }else{
      wrapper.append(el("label","",label));
      if(type==="textarea")input=document.createElement("textarea");
      else if(type==="category"){input=document.createElement("select");for(const c of categories){const o=document.createElement("option");o.value=c;o.textContent=c;input.append(o)}}
      else{input=document.createElement("input");input.type=type==="number"?"number":type==="email"?"email":"text";if(type==="number")input.min="1900";}
      if(type==="languages")input.value=Array.isArray(obj[key])?obj[key].join(", "):"";
      else if(type==="stills")input.value=Array.isArray(obj[key])?obj[key].map(x=>x.image).filter(Boolean).join("\n"):"";
      else input.value=obj[key]??"";
      input.setAttribute("aria-label",label);wrapper.append(input);
    }
    input.addEventListener(type==="checkbox"?"change":"input",()=>{
      if(type==="checkbox")obj[key]=input.checked;
      else if(type==="number")obj[key]=input.value===""?"":Number(input.value);
      else if(type==="languages")obj[key]=input.value.split(/[,，\n]/).map(x=>x.trim()).filter(Boolean);
      else if(type==="stills")obj[key]=input.value.split(/\n/).map(x=>x.trim()).filter(Boolean).map(image=>({image,caption:""}));
      else obj[key]=input.value;
      markDirty();
    });
    return wrapper;
  }
  function fields(container,obj,defs){const grid=el("div","form-grid");defs.forEach(f=>grid.append(fieldRow(obj,f)));container.append(grid)}
  function panel(title,desc){const p=el("section","panel");const head=el("div","panel-title");head.append(el("h2","",title),el("span","",desc));p.append(head);return p}
  function renderMain(){
    const d=pages[current];document.getElementById("page-tag").textContent=d[0];
    document.getElementById("page-title").textContent=d[1];document.getElementById("page-description").textContent=d[2];
    document.querySelectorAll("[data-page]").forEach(b=>{if(b.dataset.page===current)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
    view.replaceChildren();
    if(current==="dashboard")return renderDashboard();
    if(["about","profile","contact"].includes(current)){
      const defs=current==="about"?aboutFields:current==="profile"?profileFields:contactFields;
      const p=panel(d[1],"資料變更不會自動發布");
      fields(p,data[current],defs);
      const t=el("div","toolbar");t.style.marginTop="25px";t.append(el("span","toolbar-note","編輯完成後請匯出 JSON，備份你的修改。"),btn("匯出修改檔案",exportJSON));p.append(t);view.append(p);return;
    }
    renderCollection();
  }
  function renderDashboard(){
    const stats=el("div","cards");
    [[String(data.works.length),"演出作品"],[String(data.gallery.length),"攝影作品"],[data.profile.model_card_pdf?"已提供":"尚未提供","模特卡"],[data.contact.email?"已提供":"尚未提供","工作信箱"]].forEach(([value,label])=>{
      const m=el("div","metric");m.append(el("strong","",value),el("span","",label));stats.append(m);
    });view.append(stats);
    const p=panel("網站內容","CONTENT SECTIONS");
    const list=el("div","collection");
    [["about","個人介紹","姓名、三語簡介及形象照片"],["profile","演員資料","身高、經紀、履歷及模特卡"],["works","演出作品","電影、影集、廣告與作品資訊"],["gallery","攝影相簿","形象照與劇照"],["contact","合作聯絡","信箱與社群平台"]].forEach(([key,name,sub])=>{
      const r=el("div","entry"),info=el("div","entry-info");info.append(el("div","entry-title",name),el("div","entry-sub",sub));r.append(info,btn("編輯 →",()=>switchPage(key)));list.append(r)
    });p.append(list);view.append(p);
  }
  function renderCollection(){
    const isWork=current==="works",arr=data[current],defs=isWork?workFields:galleryFields;
    const p=panel(isWork?"作品清單":"相簿清單",arr.length+" 筆內容");
    const tools=el("div","toolbar");tools.style.marginBottom="18px";tools.append(el("span","toolbar-note","清單內容會同步到匯出的 JSON。"),btn(isWork?"+ 新增作品":"+ 新增照片",()=>{
      const item=isWork?{title_zh:"",year:new Date().getFullYear(),category:"Film",stills:[],visible:false}:{image:"",caption_zh:""};
      arr.push(item);selected=arr.length-1;renderMain()
    },"btn dark"));p.append(tools);
    if(!arr.length)p.append(el("div","empty",isWork?"尚未新增任何正式演出作品。":"相簿目前沒有照片。"));
    else{
      const list=el("div","collection");
      const order=arr.map((x,i)=>({x,i}));if(isWork)order.sort((a,b)=>(Number(b.x.year)||0)-(Number(a.x.year)||0));
      for(const {x,i} of order){
        const row=el("div","entry"),info=el("div","entry-info");
        info.append(el("div","entry-title",(isWork?x.title_zh:x.caption_zh)||"未命名"));
        info.append(el("div","entry-sub",isWork?String(x.year||"")+" · "+String(x.category||"")+" · "+(x.visible===false?"未公開":"公開"):String(x.image||"尚未設定圖片")));
        const actions=el("div","entry-actions");
        actions.append(btn(selected===i?"收起":"編輯",()=>{selected=selected===i?null:i;renderMain()}));
        actions.append(btn("刪除",()=>{if(confirm("確定要從目前草稿刪除這筆資料嗎？")){arr.splice(i,1);selected=null;markDirty();renderMain()}}));
        row.append(info,actions);list.append(row);
        if(selected===i){
          const editor=el("div","collection-editor");fields(editor,x,defs);
          if(isWork){const tip=el("p","toolbar-note","尚未公開的作品不會顯示在前台。劇照可以直接選擇本機圖片預覽；尚未啟用正式上傳，預覽不會發布到網站。");editor.append(tip)}
          list.append(editor)
        }
      }p.append(list)
    }
    view.append(p)
  }
  function switchPage(page){current=page;selected=null;renderMain();window.scrollTo({top:0,behavior:"smooth"})}
  document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>switchPage(b.dataset.page)));
  let changed=false;
  function markDirty(){changed=true;document.title="* CHEN. | Content Studio"}
  function exportJSON(){
    const json=JSON.stringify(data,null,2)+"\n";
    const blob=new Blob([json],{type:"application/json;charset=utf-8"}),url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="chen-site.json";document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  document.getElementById("export").addEventListener("click",exportJSON);
  const picker=document.getElementById("file-input");
  document.getElementById("import").addEventListener("click",()=>picker.click());
  picker.addEventListener("change",async()=>{
    const file=picker.files[0];if(!file)return;
    try{
      if(file.size>2*1024*1024)throw Error("JSON 檔案超過 2 MB");
      const parsed=JSON.parse(await file.text());
      if(!parsed||typeof parsed!=="object"||Array.isArray(parsed))throw Error("檔案格式不正確");
      if(!confirm("確定載入這份 JSON？目前未匯出的草稿會被覆蓋。"))return;
      data=norm(parsed);markDirty();renderMain()
    }catch(err){alert("無法匯入："+err.message)}finally{picker.value=""}
  });
  window.addEventListener("beforeunload",event=>{if(changed){event.preventDefault();event.returnValue=""}});
  const notice=document.getElementById("auth-notice");
  const login=document.getElementById("login"),logout=document.getElementById("logout"),publish=document.getElementById("publish");
  const previewButton=document.getElementById("preview-site"),reviewButton=document.getElementById("review-release");
  const reviewPanel=document.getElementById("release-review-panel");
  let approvedPlanId=null;
  previewButton.addEventListener("click",()=>{
    if(changed && !confirm("有尚未儲存的編輯內容。預覽會顯示 GitHub 測試分支最後儲存的草稿，仍要開啟嗎？"))return;
    window.open("/preview","_blank","noopener,noreferrer");
  });
  reviewButton.addEventListener("click",async()=>{
    approvedPlanId=null;reviewPanel.hidden=false;reviewPanel.replaceChildren();
    reviewPanel.append(el("h2","","發布前檢查"),el("p","","正在比對已儲存的 GitHub 草稿與正式網站…"));
    if(changed){reviewPanel.append(el("p","","你目前有尚未儲存的編輯內容。請先使用「儲存草稿」，再重新檢查。"));return}
    try{
      const response=await fetch("/api/publish/plan",{credentials:"same-origin",cache:"no-store"});
      const plan=await response.json();
      if(!response.ok)throw Error(plan.error||"無法比對資料");
      approvedPlanId=plan.planId;
      reviewPanel.replaceChildren(el("h2","","正式發布檢查"));
      reviewPanel.append(el("p","","此次發布將以 GitHub 測試分支的最新草稿為準，照片和網站資料會在一次 GitHub 提交中同步。"));
      reviewPanel.append(el("p","","異動內容："+(plan.sections.length?plan.sections.join("、"):"無內容變更")+"。"));
      reviewPanel.append(el("p","","照片檔案數："+plan.mediaCount+"。圖片一旦發布至正式網站，即可能被搜尋引擎存取。"));
      if(plan.media.length){
        const heading=el("p","","請確認以下照片均可公開使用，且版面與人物呈現符合預期：");
        const mediaGrid=el("div","release-media");
        for(const path of plan.media){
          const fig=document.createElement("figure"),img=document.createElement("img");
          img.loading="lazy";img.alt="待發布的照片";
          img.src="/api/media/preview?path="+encodeURIComponent(path);
          fig.append(img,el("figcaption","",path.split("/").pop()));mediaGrid.append(fig);
        }
        reviewPanel.append(heading,mediaGrid);
      }
      const releaseCheck=el("label","release-check");
      const verified=document.createElement("input");verified.type="checkbox";
      releaseCheck.append(verified,el("span","","我已檢查草稿預覽、照片、聯絡方式與公開權利；確認發布的內容可以對外公開。"));
      reviewPanel.append(releaseCheck);
      const status=el("p","",plan.canPublish?"正式發布已開放。請先預覽並確認所有個人資訊與照片。":"目前仍處於安全測試階段：已可檢查發布內容，但正式發布尚未開放。");
      reviewPanel.append(status);
      const actions=el("div","toolbar");
      actions.append(btn("預覽草稿",()=>window.open("/preview","_blank","noopener,noreferrer")));
      if(plan.canPublish && plan.changed){
        actions.append(btn("確認發布正式網站",async()=>{
          if(!approvedPlanId)return;
          if(!verified.checked){alert("請先完成發布內容確認。");return;}
          if(!confirm("最後確認：是否將已儲存草稿與照片同步到正式 CHEN. 官方網站？此操作會建立 GitHub main 提交並公開內容。"))return;
          const finalInput=prompt('請輸入 PUBLISH 以確認正式發布（英文大寫）');
          if(finalInput!=="PUBLISH")return;
          const candidate=approvedPlanId;approvedPlanId=null;
          try{
            const res=await fetch("/api/publish/confirm",{
              method:"POST",credentials:"same-origin",
              headers:{"content-type":"application/json","x-chen-csrf":apiSession.csrf},
              body:JSON.stringify({planId:candidate,confirmation:"PUBLISH"})
            });
            const result=await res.json();
            if(!res.ok)throw Error(result.error||"發布失敗");
            reviewPanel.replaceChildren(el("h2","","已提交正式網站更新"),el("p","","GitHub Commit："+result.commit+"。GitHub Pages 更新顯示可能稍有延遲。"));
          }catch(err){reviewPanel.append(el("p","","未完成發布："+err.message+"。請重新執行發布前檢查。"))}
        },"btn dark"));
      }
      reviewPanel.append(actions);
    }catch(err){reviewPanel.replaceChildren(el("h2","","無法完成發布檢查"),el("p","",err.message))}
  });
  async function start(){
    if(isWorkerHost){
      try{
        const response=await fetch("/api/session",{credentials:"same-origin",cache:"no-store"});
        if(!response.ok)throw Error("無法取得登入狀態");
        const session=await response.json();
        if(session.authenticated){
          apiSession=session;
          publish.hidden=!session.canSave;logout.hidden=false;previewButton.hidden=false;reviewButton.hidden=false;
          notice.textContent="已透過 GitHub 登入："+session.login+"。"+(session.canSave?"已開放儲存至 GitHub 測試分支。測試照片會存於公開儲存庫，但不會立即顯示於正式網站。":"目前為安全測試模式：尚未開放儲存草稿。可編輯及匯出 JSON 備份。");
          const contentResponse=await fetch("/api/content",{credentials:"same-origin",cache:"no-store"});
          if(!contentResponse.ok)throw Error("無法讀取網站的最新資料");
          const payload=await contentResponse.json();data=norm(payload.data);contentSha=payload.sha;
        }else{
          login.hidden=false;
          notice.textContent="尚未登入。可先以預覽模式編輯並匯出 JSON；只有授權的 GitHub 帳號可以發布。";
        }
      }catch(error){notice.textContent="後端尚未準備完成："+error.message+"。目前僅提供預覽與 JSON 匯出。";}
    }
    if(!apiSession){
      try{
        const r=await fetch(DATA_URL,{cache:"no-store"});
        if(!r.ok)throw Error("HTTP "+r.status);
        data=norm(await r.json());
      }catch(err){notice.textContent+=" 無法載入網站資料："+err.message;}
    }
    renderMain();
  }
  login.addEventListener("click",()=>{location.href="/auth/login"});
  logout.addEventListener("click",async()=>{
    if(!apiSession)return;
    if(changed&&!confirm("目前有未發布的修改。確定登出嗎？"))return;
    await fetch("/api/logout",{method:"POST",headers:{"x-chen-csrf":apiSession.csrf},credentials:"same-origin"});
    changed=false;location.href="/studio";
  });
  publish.addEventListener("click",async()=>{
    if(!apiSession?.canSave||!contentSha)return alert("目前尚未開放儲存草稿");
    if(!confirm("確定要將目前資料儲存至 GitHub 測試分支？不會更新正式網站。"))return;
    publish.disabled=true;publish.textContent="儲存中…";
    try{
      const response=await fetch("/api/content",{
        method:"PUT",credentials:"same-origin",
        headers:{"content-type":"application/json","x-chen-csrf":apiSession.csrf},
        body:JSON.stringify({sha:contentSha,data})
      });
      const result=await response.json();
      if(!response.ok)throw Error(result.error||"發布失敗");
      contentSha=result.sha;changed=false;document.title="CHEN. | Content Studio";
      alert("草稿已儲存到 GitHub 測試分支，正式網站尚未更新。");
    }catch(error){alert("未能發布："+error.message+"。若內容已在其他地方修改，請先匯出備份，重新整理取得最新版本。")}
    finally{publish.disabled=false;publish.textContent="儲存草稿"}
  });
  renderMain();start();
})();
</script>
</body>
</html>
