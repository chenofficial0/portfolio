<style>

.photo-uploader .upload-status{line-height:1.8}

.still-entry .photo-uploader{border:0;padding:0}
.still-top{display:flex;justify-content:space-between;align-items:center;gap:15px}

.checkline{display:flex;align-items:center;gap:9px;font-size:12px}.checkline input{width:15px;height:15px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.metric{padding:19px;border:1px solid var(--line);min-height:98px}.metric strong{display:block;font-size:28px;font-weight:400}.metric span{display:block;color:#999;font-size:10px;margin-top:7px}
.collection{display:grid;gap:11px}.entry{border:1px solid var(--line);padding:16px;display:flex;gap:15px;align-items:center;justify-content:space-between}.entry-info{min-width:0}.entry-title{font-weight:500;font-size:13px;overflow-wrap:anywhere}.entry-sub{font-size:10px;color:#929292;margin-top:3px}.entry-actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:34px;border:1px dashed #deded9;color:#aaa;font-size:12px;text-align:center}
.collection-editor{border:1px solid var(--line);background:#fcfcfb;padding:23px;margin-top:16px}
.toolbar{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toolbar-note{font-size:10px;color:#999}
.status{font-size:11px;color:#777}.status.good{color:var(--green)}
footer{border-top:1px solid var(--line);padding-top:27px;font-size:10px;color:#999}
[hidden]{display:none!important}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:20px 18px;border-bottom:1px solid var(--line);border-right:0}.brand{font-size:23px}.brand-sub{margin-top:3px}.nav{margin:18px -4px 0;display:flex;overflow-x:auto;gap:3px}.nav button{width:auto;white-space:nowrap;padding:10px}.nav small,.side-foot{display:none}.content{width:calc(100% - 38px)}.topbar{height:auto;min-height:77px;padding:13px 0}.hero{padding:38px 0 33px}.form-grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.cards{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column;gap:9px}.entry{align-items:flex-start;flex-direction:column}.content{width:calc(100% - 30px)}.panel{padding:23px 0}.collection-editor{padding:14px}}
.profile-resource-control{min-width:0;display:grid;gap:10px}
.profile-resource-control .field{min-width:0}
.profile-resource-control input[type=file]{padding:9px;font-size:11px}
.fixed-resource-list{display:grid;gap:14px}
.fixed-resource-entry{border:1px solid var(--line);padding:16px;min-width:0}
.fixed-resource-entry h3{font-size:12px;font-weight:500;margin:0 0 14px}
.fixed-resource-entry .profile-resource-control{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);align-items:start}
@media(max-width:700px){.fixed-resource-entry .profile-resource-control{grid-template-columns:1fr}}
.hero-photo-list{display:grid;gap:14px}

.hero-photo-list-items{display:grid;gap:15px}
.hero-photo-entry{padding:15px;border:1px solid var(--line);display:grid;gap:12px}
.hero-photo-entry .photo-uploader{background:#fafaf9}
.hero-photo-entry .still-top strong{font-size:12px;font-weight:500}
.hero-photo-list>.btn{justify-self:start}
</style>

<div class="layout">
  <aside class="sidebar">
    <div><a href="../" class="brand" aria-label="CHEN. official website">CHEN.</a><div class="brand-sub">CONTENT STUDIO / PREVIEW</div></div>

  <main class="content">
    <header class="topbar"><span class="overline">CHEN. / WEBSITE MANAGEMENT</span><div class="top-actions"><button class="btn" id="import">匯入 JSON</button><button class="btn" id="export">匯出修改檔案</button><select id="private-revision-picker" aria-label="選擇私人草稿版本" hidden style="max-width:240px;padding:9px;border:1px solid #ddd"></select><button class="btn dark" id="publish" hidden>儲存草稿</button><button class="btn" id="preview-site" hidden>預覽網站</button><button class="btn" id="review-release" hidden>正式發布檢查</button><button class="btn" id="login" hidden>使用 GitHub 登入</button><button class="btn" id="logout" hidden>登出</button></div></header>
    <section class="hero"><div class="overline" id="page-tag">OVERVIEW</div><h1 id="page-title">網站管理總覽</h1><p id="page-description">管理 CHEN. 官方網站內容。這是客製化後台第一階段，可編輯資料並匯出 JSON；尚未連接安全發布服務。</p></section>

<script>
(() => {
  "use strict";
  const DATA_URL = new URL("https://raw.githubusercontent.com/chenofficial0/portfolio/main/content/site.json");
  const isWorkerHost = location.pathname==="/studio/private" || (location.pathname==="/studio" && location.protocol==="https:");
  let apiSession=null,contentSha=null,privateMode=false,privateRevisionId=null;
  const pages = {
    dashboard:["OVERVIEW","網站管理總覽","檢視目前內容完整度，選擇要編輯的網站區域。"],
    about:["ABOUT","個人介紹","修改中、英、韓姓名與簡介。"],
    profile:["PROFILE","演員資料","維護演員資料、模特卡與影片連結。"],
    works:["FILMOGRAPHY","演出作品","新增作品、調整演出資訊，依年份由新到舊顯示。"],
    gallery:["GALLERY","攝影相簿","新增攝影作品與三語說明。"],
    contact:["CONTACT","合作聯絡","編輯工作信箱及社群平台連結。"]
  };
  const categories=["Film","Drama","Commercial","Music Video","Modeling","Other"];
  const aboutFields=[
    ["name_zh","中文姓名"],["name_en","英文姓名"],["name_ko","韓文姓名"],
    ["birth_year","出生年份","number"],["show_birth_year","公開出生年份","checkbox"],["based_in","所屬地區"],
    ["languages","語言能力（以逗號分隔）","languages"],
    ["hero_images","首頁形象照片輪播","heroList"],
    ["bio_zh","中文簡介","textarea"],["bio_en","英文簡介","textarea"],["bio_ko","韓文簡介","textarea"]
  ];
  const profileFields=[
    ["photo","PROFILE 形象照片","photo"],["height","身高（cm）"],["weight","體重（可選填）"],
    ["bust","胸圍"],["waist","腰圍"],["hips","臀圍"],["shoe_size","鞋碼"],
    ["hair_color_zh","髮色（中文）"],["hair_color_en","髮色（英文）"],["hair_color_ko","髮色（韓文）"],
    ["eye_color_zh","瞳色（中文）"],["eye_color_en","瞳色（英文）"],["eye_color_ko","瞳色（韓文）"],
    ["agency_zh","經紀公司（中文）"],["agency_en","經紀公司（英文）"],["agency_ko","經紀公司（韓文）"],
    ["skills_zh","專長（中文）"],["skills_en","專長（英文）"],["skills_ko","專長（韓文）"]
  ];
  const contactFields=[["email","工作信箱","email"],["instagram","Instagram 連結"]];
  const workFields=[
    ["title_zh","作品名稱（中文）"],["title_en","作品名稱（英文）"],["title_ko","作品名稱（韓文）"],
    ["year","年份","number"],["production","製作公司 / 品牌"],
    ["role_zh","角色（中文）"],["role_en","角色（英文）"],["role_ko","角色（韓文）"],
    ["category","作品類型","category"],["cover","作品封面照片","photo"],
    ["video_url","影片網址"],["video_label","影片按鈕文字"],["visible","公開作品","checkbox"],
    ["stills","作品劇照","photoList"]
  ];
  const galleryFields=[
    ["image","攝影相簿照片","photo"],
    ["title_zh","照片標題（中文）"],["title_en","照片標題（英文）"],["title_ko","照片標題（韓文）"],
    ["year","拍攝年份（可選填）","number"],
    ["description_zh","照片介紹（中文）","textarea"],["description_en","照片介紹（英文）","textarea"],["description_ko","照片介紹（韓文）","textarea"],
    ["caption_zh","既有照片說明（中文，可保留）"],["caption_en","既有照片說明（英文，可保留）"],["caption_ko","既有照片說明（韓文，可保留）"]
  ];
  const view=document.getElementById("view");
  const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n};
  const btn=(label,fn,cls="btn")=>{const b=el("button",cls,label);b.type="button";b.addEventListener("click",fn);return b};
  let data={about:{},profile:{},works:[],gallery:[],contact:{}}, current="dashboard", selected=null;
  const cloned=v=>JSON.parse(JSON.stringify(v));
  const norm=d=>{
    const about=(d.about && typeof d.about==="object"&&!Array.isArray(d.about))?{...d.about}:{};
    // Keep older two-photo drafts usable, but do not retain obsolete references
    // once the new list is present (even when it is intentionally empty).
    if(Array.isArray(about.hero_images)){
      delete about.hero_image;
      delete about.hero_image_secondary;
    }
    return {
      about,
      profile:(d.profile && typeof d.profile==="object"&&!Array.isArray(d.profile))?d.profile:{},
      works:Array.isArray(d.works)?d.works:[],
      gallery:Array.isArray(d.gallery)?d.gallery:[],
      contact:(d.contact && typeof d.contact==="object"&&!Array.isArray(d.contact))?d.contact:{}
    };
  };
  // Image input is local-preview only until an authenticated, tested upload endpoint is enabled.
  async function compressPhoto(file){
    if(!["image/jpeg","image/png","image/webp"].includes(file.type))throw Error("只支援 JPG、PNG、WebP");
    if(file.size>10*1024*1024)throw Error("請選擇小於 10 MB 的照片");
    const objectURL=URL.createObjectURL(file);
    let image;
    try{image=await createImageBitmap(file)}finally{URL.revokeObjectURL(objectURL)}
    try{
      const maxSide=2000,ratio=Math.min(1,maxSide/Math.max(image.width,image.height));
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(image.width*ratio));
      canvas.height=Math.max(1,Math.round(image.height*ratio));
      const ctx=canvas.getContext("2d");
      if(!ctx)throw Error("瀏覽器無法處理圖片");
      ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(image,0,0,canvas.width,canvas.height);
      const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",0.82));
      if(!blob||blob.size>1.5*1024*1024)throw Error("照片處理後仍超過上傳限制，請先壓縮");
      return blob;
    }finally{image.close?.()}
  }
  // Local previews persist when switching tabs, but are never encoded into site.json.
  // They remain local to this browser tab and are not uploaded to GitHub.
  const localPhotos=new WeakMap();
  const activePhotoURLs=new Set();
  function photoCache(obj){
    let cache=localPhotos.get(obj);
    if(!cache){cache=new Map();localPhotos.set(obj,cache)}
    return cache;
  }
  function cachePhoto(obj,key,blob){
    const cache=photoCache(obj);
    const previous=cache.get(key);
    if(previous){URL.revokeObjectURL(previous.url);activePhotoURLs.delete(previous.url)}
    const url=URL.createObjectURL(blob);
    activePhotoURLs.add(url);
    cache.set(key,{blob,url});
    return url;
  }
  function clearPhoto(obj,key){
    const cache=localPhotos.get(obj);
    const previous=cache?.get(key);
    if(previous){URL.revokeObjectURL(previous.url);activePhotoURLs.delete(previous.url);cache.delete(key)}
  }
  window.addEventListener("pagehide",()=>{for(const url of activePhotoURLs)URL.revokeObjectURL(url);activePhotoURLs.clear()});
  function stagedImagePreviewURL(url){
    if(!isWorkerHost||!apiSession||typeof url!=="string")return "";
    if(/^private-media\/chen-(?:hero|profile|gallery|work-cover|work-still|resource)-\d{4}-\d{2}-\d{2}-[A-Za-z0-9_-]{16}\.(?:jpg|png|pdf)$/.test(url))return "/api/media/preview?path="+encodeURIComponent(url);
    if(/^private-kv\/chen-(?:hero|profile|gallery|work-cover|work-still|resource)-\d{4}-\d{2}-\d{2}-[A-Za-z0-9_-]{16}\.(?:jpg|png|pdf)$/.test(url))return "/api/media/preview?path="+encodeURIComponent(url);
    try{
      const parsed=new URL(url);
      if(parsed.hostname!=="chenofficial0.github.io")return "";
      const path=parsed.pathname.replace(/^\/portfolio\//,"");
      if(!(/^(?:assets\/uploads\/chen-(?:hero|profile|gallery|work-cover|work-still)-\d{4}-\d{2}-\d{2}-[A-Za-z0-9_-]{16}\.jpg|assets\/uploads\/chen-resource-\d{4}-\d{2}-\d{2}-[A-Za-z0-9_-]{16}\.(?:pdf|jpg|png))$/.test(path)))return "";
      return "/api/media/preview?path="+encodeURIComponent(path);
    }catch(_){return ""}
  }
  function createPhotoEditor(obj,key,label){
    const wrap=el("div","field full");
    wrap.append(el("label","",label));
    const panel=el("div","photo-uploader"),preview=document.createElement("img");
    preview.alt=label+"預覽";preview.hidden=true;
    const actions=el("div","upload-actions"),input=document.createElement("input");
    input.type="file";input.accept="image/jpeg,image/png,image/webp";input.hidden=true;
    input.setAttribute("aria-label",label+"，選擇照片");
    const pick=btn("選擇照片",()=>input.click());
    const upload=btn("上傳照片",async()=>{
      const entry=localPhotos.get(obj)?.get(key);
      if(!entry||!apiSession?.canUpload)return;
      if(!confirm("確定上傳照片？照片會存至私人暫存空間，不會立刻公開。正式發布前仍請確認擁有使用權。"))return;
      upload.disabled=true;status.textContent="正在將照片儲存至私人暫存空間…";
      try{
        const base64=await new Promise((resolve,reject)=>{
          const reader=new FileReader();
          reader.onload=()=>resolve(String(reader.result).split(",")[1]||"");
          reader.onerror=()=>reject(Error("照片讀取失敗"));
          reader.readAsDataURL(entry.blob);
        });
        const scope=current==="about"?"hero":current==="profile"?"profile":current==="gallery"?"gallery":key==="cover"?"work-cover":"work-still";
        const response=await fetch("/api/media/image",{
          method:"POST",credentials:"same-origin",
          headers:{"content-type":"application/json","x-chen-csrf":apiSession.csrf},
          body:JSON.stringify({scope,mime:"image/jpeg",base64})
        });
        const result=await response.json();
        if(!response.ok)throw Error(result.error||"圖片上傳失敗");
        obj[key]=result.url;pathInput.value=result.url;entry.uploaded=true;
        markDirty();showPhoto();
        status.textContent="照片已儲存至私人暫存空間；請再儲存草稿，正式網站尚未更新。";
      }catch(err){status.textContent="上傳失敗："+err.message}
      finally{upload.disabled=!apiSession?.canUpload||!localPhotos.get(obj)?.get(key)}
    },"btn dark");
    upload.disabled=true;
    upload.title=apiSession?.canUpload?"上傳至私人暫存空間":"安全上傳功能尚未啟用";

  function translatedField(obj,group){
    const wrap=el("section","translated-field");
    const title=el("div","translated-field-title",group[0][1].replace(/（(?:中文|英文|韓文)）/g,"").replace(/^(?:中文|英文|韓文)/,""));

    const content=el("div","translated-content");
    const languages=[["zh","中文"],["en","English"],["ko","한국어"]];
    const buttons=[],panels=[];
    let active=0;
    const show=()=>{
      buttons.forEach((button,i)=>{
        const selected=i===active;button.setAttribute("aria-pressed",String(selected));button.classList.toggle("active",selected);
        panels[i].hidden=!selected;
        const key=group.find(f=>f[0].endsWith("_"+languages[i][0]))?.[0];
        const filled=key&&String(obj[key]??"").trim().length>0;
        button.textContent=languages[i][1]+(filled?" ✓":" · 未填");
      });
    };
    languages.forEach(([lang,label],i)=>{
      const row=group.find(f=>f[0].endsWith("_"+lang));
      const button=btn(label,()=>{active=i;show();});
      button.className="translated-tab";button.setAttribute("aria-label",title.textContent+" — "+label);

        panel.append(field);

  const stagedResourceFiles=new WeakMap();
  function resourceInput(item){
    const wrap=el("div","profile-resource-control");
    const typeField=el("div","field"),label=el("label","","資料類型");
    const type=document.createElement("select");
    for(const [value,title] of [["url","外部連結"],["pdf","PDF 文件"],["jpg","JPG 圖片"],["png","PNG 圖片"]]){
      const option=document.createElement("option");option.value=value;option.textContent=title;type.append(option);
    }
    const inferred=/\.pdf(?:\?|$)/i.test(item.url||"")?"pdf":/\.png(?:\?|$)/i.test(item.url||"")?"png":/\.jpe?g(?:\?|$)/i.test(item.url||"")?"jpg":"url";
    type.value=item.kind||inferred;typeField.append(label,type);wrap.append(typeField);
    const source=el("div","field");wrap.append(source);
    function renderSource(){
      source.replaceChildren();
      if(type.value==="url"){
        source.append(fieldRow(item,["url","HTTPS 網址"]));return;
      }
      const picker=document.createElement("input");picker.type="file";
      picker.accept={pdf:".pdf,application/pdf",jpg:".jpg,.jpeg,image/jpeg",png:".png,image/png"}[type.value];
      picker.setAttribute("aria-label","選擇要上傳的"+type.value.toUpperCase()+"檔案");
      const status=el("small","",item.url?"目前已設定檔案（可重新上傳）":"尚未選取檔案");
      const upload=btn("上傳檔案至測試分支",async()=>{
        const file=stagedResourceFiles.get(item);if(!file||!apiSession?.canUpload)return;

        upload.disabled=true;status.textContent="上傳中…";
        try{
          const base64=await new Promise((resolve,reject)=>{
            const reader=new FileReader();
            reader.onload=()=>resolve(String(reader.result).split(",")[1]||"");
            reader.onerror=()=>reject(Error("無法讀取檔案"));
            reader.readAsDataURL(file);
          });
          const mime={pdf:"application/pdf",jpg:"image/jpeg",png:"image/png"}[type.value];
          const response=await fetch("/api/media/resource",{
            method:"POST",credentials:"same-origin",
            headers:{"content-type":"application/json","x-chen-csrf":apiSession.csrf},
            body:JSON.stringify({mime,base64})
          });
          const result=await response.json();
          if(!response.ok)throw Error(result.error||"上傳失敗");
          item.url=result.url;item.kind=type.value;markDirty();
          stagedResourceFiles.delete(item);picker.value="";
          status.textContent="上傳成功，請按「儲存草稿」保存連結。";
          renderSource();
        }catch(error){status.textContent="上傳失敗："+error.message;upload.disabled=false}
      },"btn dark");
      upload.disabled=!apiSession?.canUpload||!stagedResourceFiles.has(item);
      picker.addEventListener("change",()=>{
        const file=picker.files?.[0];if(!file)return;
        const mime={pdf:"application/pdf",jpg:"image/jpeg",png:"image/png"}[type.value];
        if(file.type!==mime||file.size>4194304||file.size<100){
          status.textContent="只支援所選格式且檔案必須小於 4 MB";picker.value="";upload.disabled=true;return;
        }
        stagedResourceFiles.set(item,file);upload.disabled=!apiSession?.canUpload;
        status.textContent="已選擇："+file.name+"，尚未上傳";
      });
      source.append(el("label","","選擇檔案"),picker,status,upload);
      if(item.url){
        const link=el("a","toolbar-note","查看目前檔案");
        link.href=stagedImagePreviewURL(item.url)||item.url;link.target="_blank";link.rel="noopener noreferrer";source.append(link);
      }
    }
    type.addEventListener("change",()=>{
      if(item.url&&!confirm("切換資料類型會清除原有連結，確定嗎？")){type.value=item.kind||inferred;return}
      item.kind=type.value;item.url="";stagedResourceFiles.delete(item);markDirty();renderSource();
    });
    renderSource();return wrap;
  }

  async function refreshPrivateRevisions(selectedId=null){
    const records=[];let cursor=null;
    for(let page=0;page<10;page++){
      const result=await privateFetch("/api/draft/revisions"+(cursor?"?cursor="+encodeURIComponent(cursor):""));
      if(!Array.isArray(result.revisions))throw Error("版本清單格式不正確");
      records.push(...result.revisions);
      cursor=result.nextCursor;
      if(!cursor)break;
    }
    if(cursor)throw Error("版本數量超過可驗證範圍，停止儲存");
    privatePicker.replaceChildren();
    const first=document.createElement("option");
    first.value="";first.textContent="選擇私人草稿版本";privatePicker.append(first);
    records.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
    for(const record of records){
      if(!/^[A-Za-z0-9_-]{32,64}$/.test(record.id))throw Error("版本 ID 無效");
      const option=document.createElement("option");
      option.value=record.id;
      option.textContent=String(record.createdAt||"未知時間")+" · "+record.id.slice(0,8);
      privatePicker.append(option);
    }
    privatePicker.hidden=false;
    privatePicker.value=selectedId&&records.some(x=>x.id===selectedId)?selectedId:"";
    return records.length;
  }

  async function start(){
    if(isWorkerHost){
      try{
        const response=await fetch("/api/session",{credentials:"same-origin",cache:"no-store"});
        if(!response.ok)throw Error("無法取得登入狀態");
        const session=await response.json();
        if(session.authenticated){
          apiSession=session;
          privateMode=session.canUseImmutableStudio===true;
          if(privateMode&&!session.canAppendImmutableDraft)publish.textContent="私人草稿唯讀模式";
          publish.hidden=!session.canSave&&!privateMode;
          logout.hidden=false;previewButton.hidden=false;previewButton.disabled=privateMode;reviewButton.hidden=privateMode&&!session.canReviewPrivatePublish;
          notice.textContent="已透過 GitHub 登入："+session.login+"。"+(session.canSave?"已開放儲存至 GitHub 測試分支。新上傳照片需要已設定私人儲存空間，否則後端會拒絕上傳。":"目前為安全測試模式：尚未開放儲存草稿。可編輯及匯出 JSON 備份。");
          if(privateMode){
            publish.hidden=true;
            const count=await refreshPrivateRevisions();
            notice.textContent=count
              ?"請從右上方選擇要編輯的私人草稿版本；不會自動選擇最新版。"
              :"私人草稿尚未安全遷移，目前禁止儲存。";
          }else{
            const contentResponse=await fetch("/api/content",{credentials:"same-origin",cache:"no-store"});
            if(!contentResponse.ok)throw Error("無法讀取網站的最新資料");
            const payload=await contentResponse.json();data=norm(payload.data);contentSha=payload.sha;
          }
        }else{
          login.hidden=false;
          notice.textContent="尚未登入。可先以預覽模式編輯並匯出 JSON；只有授權的 GitHub 帳號可以發布。";
        }
      }catch(error){notice.textContent="後端尚未準備完成："+error.message+"。目前僅提供預覽與 JSON 匯出。";}
    }
    if(!apiSession && location.pathname!=="/studio/private"){
      try{
        const r=await fetch(DATA_URL,{cache:"no-store"});
        if(!r.ok)throw Error("HTTP "+r.status);
        data=norm(await r.json());
      }catch(err){notice.textContent+=" 無法載入網站資料："+err.message;}
    }
    renderMain();
  }

      });
      const result=await response.json();
      if(!response.ok)throw Error(result.error||"發布失敗");
      contentSha=result.sha;changed=false;document.title="CHEN. | Content Studio";
      alert("草稿已儲存到 GitHub 測試分支，正式網站尚未更新。");
    }catch(error){alert("未能發布："+error.message+"。若內容已在其他地方修改，請先匯出備份，重新整理取得最新版本。")}
    finally{publish.disabled=false;publish.textContent="儲存草稿"}
  });
  renderMain();start();
})();
</script>
</body>
</html>
