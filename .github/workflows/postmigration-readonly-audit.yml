name: CHEN Post-Migration Read-Only Integrity Audit

# Manually triggered through a dedicated feature-branch trigger file.
# Strictly GET, never deploys or mutates Cloudflare or GitHub content.
on:
  push:
    branches:
      - feature/zero-cost-private-media
    paths:
      - "backend/TRIGGER_POST_MIGRATION_READONLY_AUDIT.md"

permissions:
  contents: read

jobs:
  verify-migrated-private-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate original media and immutable revision format
        run: |
          node backend/private-kv-migration-bundle.test.mjs
          node --check backend/phase17-postmigration-readonly.mjs
      - name: Verify real migrated private KV content without writes
        env:
          CLOUDFLARE_KV_READ_TOKEN: ${{ secrets.CLOUDFLARE_KV_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node backend/phase17-postmigration-readonly.mjs
