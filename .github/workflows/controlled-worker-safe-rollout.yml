name: CHEN Controlled Worker v85 Safe Rollout

# Exactly one explicit approval trigger, no deployment on ordinary code pushes.
on:
  push:
    branches:
      - feature/zero-cost-private-media
    paths:
      - "backend/TRIGGER_SAFE_WORKER_V85_ROLLOUT.md"

permissions:
  contents: read

jobs:
  safe-code-rollout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify disabled feature configuration and security
        run: |
          node backend/phase15-acceptance.test.mjs
          node backend/zero-cost-security.test.mjs
          node --check backend/phase18-controlled-worker-activate.mjs
      - name: Activate exact audited v85 and rollback if health fails
        env:
          CLOUDFLARE_WORKER_EDITOR_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_EDITOR_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHEN_DEPLOY_DISABLED_FEATURES: CONFIRM_SAFE_VERSION_ROLLOUT
        run: node backend/phase18-controlled-worker-activate.mjs
