name: CHEN Phase 20 Live Read-Only Studio Verification

on:
  push:
    branches:
      - feature/zero-cost-private-media
    paths:
      - "backend/TRIGGER_PHASE20_LIVE_AUDIT.md"

permissions:
  contents: read

jobs:
  verify-deployed-readonly-studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate live site and private Studio regression code
        run: |
          node --check backend/phase20-live-readonly-security.mjs
          node backend/phase18-live-readonly.test.mjs
          node backend/phase20-readonly-candidate.test.mjs
      - name: Verify actual production version, OAuth gating and disabled writes
        env:
          CLOUDFLARE_WORKER_EDITOR_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_EDITOR_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node backend/phase20-live-readonly-security.mjs
