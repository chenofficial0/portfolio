name: CHEN Zero-Cost Backend Tests

on:
  push:
    branches:
      - feature/zero-cost-private-media
    paths:
      - "backend/**"
      - ".github/workflows/zero-cost-backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify module syntax
        run: |
          node --check backend/src/worker.js
          node --check backend/src/private-kv-media.js
          node --check backend/src/private-kv-draft.js
          node --check backend/src/private-kv-revisions.js
          node --check backend/src/private-kv-compare.js
          node --check backend/src/revision-compare-page.js
          node --check backend/src/private-kv-revision-list.js
          node --check backend/src/private-kv-merge-preview.js
          node --check backend/src/private-kv-merge-save.js
      - name: Run isolated tests without external deployment
        run: |
          node backend/private-kv-media.test.mjs
          node backend/private-kv-draft.test.mjs
          node backend/private-kv-revisions.test.mjs
          node backend/private-kv-compare.test.mjs
          node backend/private-kv-revision-list.test.mjs
          node backend/private-kv-merge-preview.test.mjs
          node backend/private-kv-merge-save.test.mjs
          node backend/migration-preflight.test.mjs
          node backend/zero-cost-security.test.mjs
          node backend/phase15-acceptance.test.mjs

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser test dependency
        run: npm install --prefix backend --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: ./backend/node_modules/.bin/playwright install chromium
      - name: Run desktop and mobile browser smoke tests
        run: node backend/phase16-browser-smoke.test.mjs
