name: CHEN Phase 19 Production Read-Only Security Audit

on:
  push:
    branches:
      - feature/zero-cost-private-media
    paths:
      - "backend/TRIGGER_PHASE19_PRODUCTION_READONLY.md"

permissions:
  contents: read

jobs:
  production-readonly-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify syntax and live website
        run: |
          node --check backend/phase19-production-security-readonly.mjs
          node backend/phase18-live-readonly.test.mjs
      - name: Verify deployed Worker, disabled release gates, and anonymous API protection
        env:
          CLOUDFLARE_WORKER_EDITOR_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_EDITOR_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node backend/phase19-production-security-readonly.mjs
